<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Electronic Voting Platform</title>
</head>
<body>
  <h1>Secure Electronic Voting Platform</h1>
  <p>Prototype – server status check</p>

  <button id="checkBtn">Check server</button>
  <p id="result"></p>

  <script>
    document.getElementById('checkBtn').addEventListener('click', async () => {
      const result = document.getElementById('result')
      try {
        const response = await fetch('/api/health')
        const data = await response.json()
        result.textContent = 'Server status: ' + data.status
      } catch (error) {
        result.textContent = 'Server not reachable'
      }
    })
  </script>
</body>
</html>
