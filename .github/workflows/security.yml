name: SR-03 Memory-Safe Paradigms & CI/CD Fuzzing

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  sast-and-audit:
    name: Dependency Audit & Automated Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js (Memory-Safe Runtime)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Automated Dependency Security Gate
      # Blocks vulnerable dependencies from merging into the project
      run: npm audit --audit-level=critical

    - name: Run Jest Fuzzing & Security Tests
      # Automatically discovers and runs test suites for all 5 group members
      run: npm test